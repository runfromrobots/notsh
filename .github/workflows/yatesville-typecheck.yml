name: Yatesville Boat Race Type Check

on:
  push:
    paths:
      - 'yatesville-boat-race/**'
      - '.github/workflows/yatesville-typecheck.yml'
  pull_request:
    paths:
      - 'yatesville-boat-race/**'
      - '.github/workflows/yatesville-typecheck.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yatesville-boat-race

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: yatesville-boat-race/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build check
        run: npm run build
