name: Little Big Cat Type Check

on:
  push:
    branches: [main]
    paths: ['little-big-cat/**', '.github/workflows/little-big-cat.yml']
  pull_request:
    branches: [main]
    paths: ['little-big-cat/**', '.github/workflows/little-big-cat.yml']

defaults:
  run:
    working-directory: little-big-cat

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: little-big-cat/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build check
        run: npm run build
